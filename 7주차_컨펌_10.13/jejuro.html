<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEJU:RO · 지도 모양 따라 걷는 제주</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
:root{
  --o:#F5A623; --bg:#F8F7F2; --ink:#222222; --t:#1597A8;
  --sea:#BFE2E4; --line:#E4E1D6; --muted:#7A766C; --paper:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:3px solid var(--t);outline-offset:2px}
.app{display:grid;grid-template-rows:1fr;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}

/* header */
header{display:flex;align-items:center;gap:28px;padding:12px 22px;border-bottom:2px solid var(--ink);background:var(--bg);position:relative;z-index:5}
.logo{display:flex;align-items:baseline;gap:2px;font-weight:900;font-size:24px;letter-spacing:-.03em;cursor:pointer;white-space:nowrap}
.logo i{font-style:normal;color:var(--o)}
.logo small{font-weight:600;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:0}
.steps{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.st:first-child{margin-left:auto}
.steps::-webkit-scrollbar{display:none}
.st{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;color:#B2AEA4;white-space:nowrap;transition:background .3s,color .3s}
.st b{font-weight:800;font-variant-numeric:tabular-nums}
.st.done{color:var(--ink)}
.st.done b{color:var(--t)}
.st.on{background:var(--ink);color:#fff}
.st.on b{color:var(--o)}

main{position:relative;min-height:0;min-width:0}
.stage{height:100%}
.panel{position:absolute;left:16px;top:16px;bottom:16px;width:380px;z-index:4;border:2px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:24px 24px 30px;overflow-y:auto;background:var(--bg);transform:translateX(calc(-100% - 40px));transition:transform .55s cubic-bezier(.3,1.15,.4,1),visibility .55s;visibility:hidden}
.panel.open{transform:none;visibility:visible}
.topbar{position:absolute;left:18px;top:18px;z-index:3;display:flex;gap:8px;align-items:center}
.tb-back{height:40px;padding:0 14px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);font-weight:800;font-size:13.5px;box-shadow:3px 3px 0 var(--ink)}
.tb-back:hover{background:var(--o)}
.tb-title{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:14px}
.tb-title i{width:8px;height:8px;border-radius:50%;background:var(--o)}
.area{cursor:zoom-in;outline:none}
.area-shape{fill:#fff;fill-opacity:0;stroke:#222;stroke-opacity:0;stroke-width:calc(var(--u,1)*2.5px);stroke-dasharray:calc(var(--u,1)*9px) calc(var(--u,1)*7px);transition:fill-opacity .25s,stroke-opacity .25s}
.area:hover .area-shape,.area:focus-visible .area-shape{fill-opacity:.3;stroke-opacity:.85}
.area-label{opacity:0;transition:opacity .25s;pointer-events:none}
.area:hover .area-label,.area:focus-visible .area-label{opacity:1}
.done-actions{display:flex;gap:8px;margin-top:22px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.stage{position:relative;background:var(--sea);overflow:hidden;min-height:0;min-width:0}
#map{position:absolute;inset:0}
#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}

/* panel typography */
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--t);margin-bottom:14px}
.kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--o)}
h1{font-size:40px;line-height:1.08;font-weight:900;letter-spacing:-.045em;margin-bottom:16px}
h2{font-size:28px;line-height:1.15;font-weight:850;letter-spacing:-.04em;margin-bottom:10px}
h3{font-size:15px;font-weight:800;margin:26px 0 10px}
.lead{font-size:15px;line-height:1.65;color:#4A4740;max-width:34ch}
.sub{font-size:13px;color:var(--muted);line-height:1.55}
.fade-in{animation:fin .45s ease both}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;font-weight:800;font-size:15px;background:var(--ink);color:#fff;border:2px solid var(--ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--o)}
.btn.o{background:var(--o);color:var(--ink)}
.btn.o:hover{box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{box-shadow:3px 3px 0 var(--ink)}
.btn.full{width:100%}
.btn.sm{height:36px;font-size:13px;padding:0 13px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:10px;margin-top:22px}
.back{display:flex;width:fit-content;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:22px}
.back:hover{color:var(--ink)}

/* region list */
.regions{display:grid;gap:8px;margin-top:22px}
.reg{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:12px 14px;border:2px solid var(--ink);border-radius:16px;background:var(--paper);text-align:left;transition:transform .15s,box-shadow .15s}
.reg:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.reg .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.reg strong{display:block;font-size:16px;font-weight:800}
.reg span{font-size:12.5px;color:var(--muted)}
.reg em{font-style:normal;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--bg);border:1.5px solid var(--ink)}
.howto{margin-top:28px;padding-top:20px;border-top:2px dashed var(--line);display:grid;gap:12px}
.howto div{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:13.5px;line-height:1.5;color:#4A4740}
.howto b{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}

/* tabs & chips */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.tab{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;border:1.5px solid var(--ink);background:var(--paper)}
.tab.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:#EDEAE0;color:#4A4740}
.chip.on{background:var(--o);color:var(--ink)}

/* route list */
.rlist{display:grid;gap:10px;margin-top:18px}
.ritem{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;padding:12px;border:2px solid var(--ink);border-radius:18px;background:var(--paper);text-align:left;transition:transform .15s,box-shadow .15s}
.ritem:hover,.ritem.hl{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.ritem .thumb{width:72px;height:72px;border-radius:14px;display:grid;place-items:center}
.ritem strong{font-size:16px;font-weight:800;display:block;margin-bottom:3px}
.ritem .meta{font-size:12.5px;color:var(--muted)}
.ritem .meta b{color:var(--ink);font-weight:700}

/* timeline */
.tl{position:relative;margin-top:6px}
.tli{display:grid;grid-template-columns:52px 28px 1fr;gap:10px;position:relative}
.tli .tm{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;padding-top:4px;text-align:right}
.tli .nd{width:28px;height:28px;border-radius:50%;border:2.5px solid;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;position:relative;z-index:1}
.tli .bd{padding:3px 0 14px}
.tli .bd strong{font-size:15px;font-weight:800;display:block}
.tli .bd span{font-size:12.5px;color:var(--muted)}
.tli::before{content:"";position:absolute;left:75px;top:28px;bottom:0;width:2px;background:repeating-linear-gradient(var(--ink) 0 4px,transparent 4px 8px)}
.tli:last-child::before{display:none}
.leg{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:#EEF7F8;color:var(--t)}
.leg.bus{background:#FEF3DF;color:#A86A00}
.tli.end .nd{background:var(--ink);color:#fff;border-color:var(--ink)}

/* customize */
.field{margin-top:18px}
.field label{display:block;font-size:12.5px;font-weight:800;margin-bottom:8px}
select{width:100%;height:46px;border:2px solid var(--ink);border-radius:12px;padding:0 14px;font:inherit;font-weight:700;background:var(--paper);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px;background-size:6px 6px;background-repeat:no-repeat}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{padding:9px 4px;font-weight:800;font-size:14px;line-height:1.2;border-right:2px solid var(--ink);background:var(--paper)}
.seg button:last-child{border-right:0}
.seg button small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.seg button.on{background:var(--o)}
.seg button.on small{color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border:2px solid var(--ink);border-radius:14px;background:var(--paper)}
.sum div{padding:12px 10px;border-right:2px solid var(--ink)}
.sum div:last-child{border-right:0}
.sum small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
.sum b{white-space:nowrap;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.spot{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--paper);border:1.5px solid var(--line)}
.spot .nd{width:30px;height:30px;border-radius:50%;border:2.5px solid;display:grid;place-items:center;font-weight:900;font-size:13px}
.spot strong{font-size:14.5px;font-weight:800;display:block}
.spot span{font-size:12px;color:var(--muted)}
.spot.pop{animation:pop .5s ease}
@keyframes pop{30%{background:#FEF3DF;transform:scale(1.02)}}
.swap{font-size:12px;font-weight:800;padding:7px 10px;border-radius:9px;border:1.5px solid var(--ink);background:var(--bg);white-space:nowrap}
.swap:hover{background:var(--o)}
.bus{margin-top:14px;display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:#EEF7F8;font-size:13px;line-height:1.5;color:#1F5F68}
.bus b{color:var(--t)}

/* walk */
.prog{margin-top:8px}
.pct{font-size:64px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:22px;margin-left:2px}
.bar{height:14px;border:2px solid var(--ink);border-radius:999px;margin-top:14px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;background:var(--o);width:0;transition:width .2s linear}
.now{margin-top:18px;padding:14px 16px;border:2px solid var(--ink);border-radius:16px;background:var(--paper)}
.now small{font-size:12px;font-weight:700;color:var(--muted)}
.now strong{display:block;font-size:20px;font-weight:900;margin-top:2px}
.checks{display:grid;gap:6px;margin-top:10px}
.ck{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:#A9A59B}
.ck i{width:20px;height:20px;border-radius:50%;border:2px solid #CFCBC0;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff;flex:none}
.ck.on{color:var(--ink)}
.ck.on i{background:var(--t);border-color:var(--t)}

/* card overlay */
.overlay{position:absolute;inset:0;transition:background .5s;display:flex;align-items:center;justify-content:flex-end;padding:28px 6%;pointer-events:none;z-index:3}
.card{width:340px;height:540px;perspective:1600px;pointer-events:auto;opacity:0;transform:translateY(40px) rotate(4deg) scale(.92);transition:opacity .5s,transform .6s cubic-bezier(.2,1.3,.4,1)}
.card.show{opacity:1;transform:none}
.inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.5,0,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2.5px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:7px 7px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.back-face{transform:rotateY(180deg)}
.cf-top{height:236px;position:relative;display:grid;place-items:center;border-bottom:2.5px solid var(--ink);flex:none}
.cf-top .no{position:absolute;top:14px;left:16px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--paper);border:1.5px solid var(--ink)}
.cf-top .rg{position:absolute;top:14px;right:16px;font-size:12px;font-weight:800}
.cf-body{padding:20px 22px;display:flex;flex-direction:column;flex:1}
.cf-body h4{font-size:24px;font-weight:900;letter-spacing:-.04em}
.cf-body p{font-size:13.5px;color:#4A4740;line-height:1.55;margin-top:6px}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.cstats div{background:var(--bg);border-radius:12px;padding:9px 10px}
.cstats small{font-size:11px;font-weight:700;color:var(--muted);display:block}
.cstats b{font-size:14.5px;font-weight:900;white-space:nowrap}
.cf-body .btn{margin-top:auto}
.bk-head{padding:18px 22px 12px;border-bottom:2px solid var(--ink);flex:none}
.bk-head small{font-size:12px;font-weight:800;color:var(--t)}
.bk-head h4{font-size:20px;font-weight:900;letter-spacing:-.03em}
.bk-body{padding:16px 18px 6px 8px;overflow-y:auto;flex:1}
.bk-foot{padding:12px 16px;border-top:2px solid var(--ink);display:grid;grid-template-columns:auto 1fr;gap:8px;flex:none}

/* complete card */
.done{width:350px;pointer-events:auto;border:2.5px solid var(--ink);border-radius:26px;background:var(--paper);box-shadow:7px 7px 0 var(--o);overflow:hidden;opacity:0;transform:scale(.85) rotate(-3deg);transition:opacity .5s,transform .7s cubic-bezier(.2,1.4,.4,1)}
.done.show{opacity:1;transform:rotate(-1.5deg)}
.done-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:12px;font-weight:800;border-bottom:2.5px solid var(--ink);background:var(--ink);color:#fff}
.done-top i{font-style:normal;color:var(--o)}
.done-map{position:relative;height:250px;border-bottom:2.5px solid var(--ink);background:var(--sea)}
.done-map svg{width:100%;height:100%;display:block}
.stamp{position:absolute;right:14px;bottom:-30px;width:86px;height:86px;border-radius:50%;background:var(--o);border:2.5px solid var(--ink);display:grid;place-items:center;text-align:center;font-weight:900;font-size:12px;line-height:1.1;transform:rotate(12deg)}
.stamp b{display:block;font-size:22px}
.done-body{padding:18px 20px 20px}
.done-body h4{font-size:26px;font-weight:900;letter-spacing:-.04em;max-width:220px;line-height:1.1}
.done-body p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.done-body .cstats{margin-bottom:0}

/* toast */
.toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:6;transition:all .35s cubic-bezier(.2,1.3,.4,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--o)}

/* map hint */
.hint{position:absolute;left:20px;bottom:20px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700;z-index:2;display:flex;gap:8px;align-items:center;box-shadow:3px 3px 0 var(--ink);transition:opacity .3s}
.hint.hide{opacity:0;pointer-events:none}
.hint i{width:10px;height:10px;border-radius:50%;background:var(--o);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* svg */
#map text{font-family:inherit}
.r-under,.r-line{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.r-under{stroke:#fff;stroke-width:calc(var(--u,1) * 13px)}
.r-line{stroke-width:calc(var(--u,1) * 6.5px)}
.route.draw .r-under,.route.draw .r-line{transition:stroke-dashoffset 2s cubic-bezier(.55,.05,.3,1)}
.route.drawn .r-under,.route.drawn .r-line{stroke-dashoffset:0}
.r-hit{fill:none;stroke:transparent;stroke-width:calc(var(--u,1) * 36px);cursor:pointer;pointer-events:stroke}
.route{transition:opacity .5s}
.route.dim{opacity:.14;pointer-events:none}
.route.off{opacity:0;pointer-events:none}
.route:hover .r-line,.route.hl .r-line{stroke-width:calc(var(--u,1) * 9px)}
.route:hover .r-under,.route.hl .r-under{stroke-width:calc(var(--u,1) * 17px)}
.r-label{transition:opacity .4s;pointer-events:none}
.route.drawn .r-label{opacity:1}
.walk-base{fill:none;stroke:#fff;stroke-width:calc(var(--u,1) * 12px);stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.walk-ghost{fill:none;stroke-width:calc(var(--u,1) * 4px);stroke-dasharray:calc(var(--u,1)*2px) calc(var(--u,1)*10px);stroke-linecap:round;opacity:.8}
.walk-prog{fill:none;stroke-width:calc(var(--u,1) * 7px);stroke-linecap:round;stroke-linejoin:round}
.hot{cursor:pointer}
.hot .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.hot:hover .pill-bg{fill:var(--o)}
.hot,.pins,.r-label{transition:opacity .4s}
.pin-g{transition:opacity .3s}
.walker .pulse{transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}

@media (max-width:900px){
  header{gap:12px;padding:10px 14px}
  .logo small{display:none}
  .st{padding:5px 8px}
  .st span{display:none}
  .st.on span{display:inline}
  .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:58%;transform:translateY(calc(100% + 40px))}
  .overlay{justify-content:center;padding:12px}
  .card{width:300px;height:470px}
  .cf-top{height:190px}
  .done{width:290px}
  .done-map{height:170px}
  .topbar{left:10px;top:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <main>
    <section class="stage" id="stage">

const STEPS=['INTRO','MAP ZOOM','DISCOVERY','ROUTE CARD','DETAIL','CUSTOMIZE','START WALK','COMPLETE'];

/* ============ STATE & HELPERS ============ */
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const svg=$('#map'),stage=$('#stage'),panel=$('#panel'),overlay=$('#overlay'),meas=$('#meas');
const st={step:1,region:null,route:null,diff:'보통',start:600,spots:[],swapPtr:0,filter:'all',geo:null,walk:null,busy:false};
let vb=[0,0,W,H];
const el=(tag,attrs={},parent)=>{const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n};
const f1=n=>Math.round(n*10)/10;
const hm=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?`${h}시간 ${r}분`:`${h}시간`):`${r}분`};
const region=()=>REGIONS.find(r=>r.id===st.region);
const routeById=id=>{for(const r of REGIONS){const x=r.routes.find(q=>q.id===id);if(x)return x}};
const regionOf=rt=>REGIONS.find(r=>r.routes.includes(rt));

function crPath(P,closed){
  const n=P.length,g=i=>closed?P[(i+n)%n]:P[Math.max(0,Math.min(n-1,i))];
  const p=v=>v.map(f1).join(',');
  let d='M'+p(P[0]);const L=closed?n:n-1;
  for(let i=0;i<L;i++){const a=g(i-1),b=g(i),c=g(i+1),e=g(i+2);
    d+=' C'+p([b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6])+' '+p([c[0]-(e[0]-b[0])/6,c[1]-(e[1]-b[1])/6])+' '+p(c)}
  return d+(closed?'Z':'');
}
const lnPath=(P,closed)=>'M'+P.map(v=>v.map(f1).join(',')).join(' L')+(closed?'Z':'');
function shapeD(shape,cx,cy,s){const S=SHAPES[shape];const pts=S.pts.map(([x,y])=>[cx+x*s,cy+y*s]);return {d:S.smooth?crPath(pts,S.closed):lnPath(pts,S.closed),pts}}
function measure(d,fracs){meas.setAttribute('d',d);const L=meas.getTotalLength();return {L,pts:fracs.map(f=>{const p=meas.getPointAtLength(Math.min(f,1)*L);return [p.x,p.y]})}}
function fracsFor(shape,n){const c=SHAPES[shape].closed;return Array.from({length:n},(_,i)=>c?i/n:i/(n-1))}
function geom(rt,diff){
  const D=DIFF[diff],s=rt.s*D.s,{d,pts}=shapeD(rt.shape,rt.c[0],rt.c[1],s);
  const fr=fracsFor(rt.shape,D.n),m=measure(d,fr);
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  return {d,L:m.L,fr,pins:m.pts,closed:SHAPES[rt.shape].closed,bbox:[Math.min(...xs),Math.min(...ys),Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys)]};
}
function spotsFor(rt,diff){const n=DIFF[diff].n,R=regionOf(rt),out=rt.pref.slice(0,n);let i=0;while(out.length<n){if(!out.includes(i))out.push(i);i++}return out.slice(0,n).map(i=>i%R.pool.length)}
function plan(rt,diff,spots,start){
  const g=geom(rt,diff),R=regionOf(rt),items=[];let t=start,km=0;
  const n=g.fr.length;
  for(let i=0;i<n;i++){
    const s=R.pool[spots[i]],arrive=t;t+=s.m;
    let leg=null;
    if(i<n-1||g.closed){const f2=i<n-1?g.fr[i+1]:1,k=(f2-g.fr[i])*g.L*KM,walk=k*15;
      const bus=walk>32;const m=bus?Math.round(walk*.4+9):Math.round(walk);
      leg={km:k,min:m,mode:bus?'bus':'walk'};km+=k;t+=m}
    items.push({spot:s,idx:spots[i],arrive,leave:arrive+s.m,leg});
  }
  return {g,items,km,end:t,total:t-start};
}
function upp(){const r=svg.getBoundingClientRect();if(!r.width)return 1;return Math.max(vb[2]/r.width,vb[3]/r.height)}
function applyScale(){const u=upp();svg.style.setProperty('--u',u);svg.querySelectorAll('.sc').forEach(n=>n.setAttribute('transform',`translate(${n.dataset.x},${n.dataset.y}) scale(${u})`))}
function setVB(a){vb=a;svg.setAttribute('viewBox',a.map(f1).join(' '));applyScale()}
function fitRect(x,y,w,h){const r=stage.getBoundingClientRect(),ar=r.width/r.height||1.3;if(w/h<ar){const nw=h*ar;x-=(nw-w)/2;w=nw}else{const nh=w/ar;y-=(nh-h)/2;h=nh}return [x,y,w,h]}
function zoomTo(t,ms=1200){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  return new Promise(res=>{const from=vb.slice(),t0=performance.now();if(reduce)ms=1;
    (function f(now){let p=Math.min(1,(now-t0)/ms);const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;setVB(from.map((v,i)=>v+(t[i]-v)*e));p<1?requestAnimationFrame(f):res()})(t0)})
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function scaled(parent,x,y,cls=''){const g=el('g',{class:'sc '+cls},parent);g.dataset.x=x;g.dataset.y=y;g.setAttribute('transform',`translate(${x},${y}) scale(${upp()})`);return g}
const textW=(s,fs)=>[...s].reduce((a,c)=>a+(/[\uac00-\ud7a3]/.test(c)?1:.6),0)*fs;
function pill(g,text,{fs=14,bg='#fff',fg='#222',dy=0,stroke='#222'}={}){
  const w=textW(text,fs)+fs*1.6,h=fs*2.1;
  el('rect',{class:'pill-bg',x:-w/2,y:dy-h/2,width:w,height:h,rx:h/2,fill:bg,stroke,'stroke-width':2},g);
  const t=el('text',{x:0,y:dy+1,'text-anchor':'middle','dominant-baseline':'central','font-size':fs,'font-weight':800,fill:fg},g);t.textContent=text;
}
let toastT;
function toast(html){const t=$('#toast');t.innerHTML=html;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function hint(txt){const h=$('#hint');if(!txt){h.classList.add('hide');return}$('#hintTxt').textContent=txt;h.classList.remove('hide')}
function setStep(n){st.step=n;if(!$('#steps'))return;$('#steps').innerHTML=STEPS.map((s,i)=>`<div class="st ${i+1===n?'on':i+1<n?'done':''}"><b>${String(i+1).padStart(2,'0')}</b><span>${s}</span></div>`).join('');
  const on=$('#steps .on'),sb=$('#steps');if(on&&sb.scrollWidth>sb.clientWidth)sb.scrollTo({left:on.offsetLeft-sb.clientWidth/2+on.offsetWidth/2,behavior:'smooth'})}
function miniSVG(shape,color,{pins=0,size=72,sw=.11}={}){
  const {d}=shapeD(shape,0,0,100);let pinsSvg='';const w=sw*100;
  if(pins){const m=measure(d,fracsFor(shape,pins));pinsSvg=m.pts.map(p=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${w*1.3}" fill="#fff" stroke="${color}" stroke-width="${w*.6}"/>`).join('')}
  return `<svg width="${size}" height="${size}" viewBox="-140 -145 280 280" aria-hidden="true"><path d="${d}" fill="none" stroke="#fff" stroke-width="${w*2}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>${pinsSvg}</svg>`;
}
const tint=c=>c==='#F5A623'?'#FDEBC8':c==='#1597A8'?'#CDEBEE':'#E6E3DA';

/* ============ MAP LAYERS ============ */
const AREAS={jeju:[1150,610,340,185],west:[560,930,320,250],south:[1140,1020,390,135],east:[1700,660,250,250]};
function drawAreas(){
  const L=$('#hotLayer');L.innerHTML='';
  REGIONS.forEach(r=>{const [cx,cy,rx,ry]=AREAS[r.id];
    const g=el('g',{class:'area','data-act':'region:'+r.id,role:'button',tabindex:0,'aria-label':r.name+' 확대'},L);
    el('ellipse',{cx,cy,rx,ry,class:'area-shape'},g);
    const lb=scaled(g,cx,cy,'area-label');pill(lb,r.name+' ',{fs:16,bg:'#222',fg:'#fff'});
  });
}
function regionRect(R){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  R.routes.forEach(rt=>{const b=geom(rt,'길게').bbox;x1=Math.min(x1,b[0]);y1=Math.min(y1,b[1]);x2=Math.max(x2,b[0]+b[2]);y2=Math.max(y2,b[1]+b[3])});
  return fitRect(x1-120,y1-130,x2-x1+240,y2-y1+220);
}
function drawRoutes(R){
  const L=$('#routeLayer');L.innerHTML='';
  R.routes.forEach((rt,i)=>{
    const g0=geom(rt,'보통');
    const g=el('g',{class:'route draw','data-id':rt.id,'data-act':'route:'+rt.id,tabindex:0,role:'button','aria-label':rt.name+' 코스 보기'},L);
    el('path',{d:g0.d,class:'r-under',pathLength:1},g);
    el('path',{d:g0.d,class:'r-line',pathLength:1,style:`stroke:${rt.color}`},g);
    el('path',{d:g0.d,class:'r-hit'},g);
    const lb=scaled(g,rt.c[0],g0.bbox[1]-6,'r-label');lb.style.opacity=0;
    const dark=rt.color==='#222222';
    pill(lb,`${SHAPES[rt.shape].label} · ${rt.name}`,{fs:13,dy:-14,bg:dark?'#222':'#fff',fg:dark?'#fff':'#222'});
    setTimeout(()=>{g.classList.add('drawn');setTimeout(()=>lb.style.opacity=1,1500)},250+i*500);
  });
}
function drawPins(labels=true){
  const L=$('#pinLayer');L.innerHTML='';if(!st.route)return;
  const rt=st.route,R=regionOf(rt),g=st.geo;
  g.pins.forEach((p,i)=>{const pg=scaled(L,p[0],p[1],'pin-g');
    el('circle',{r:14,fill:'#fff',stroke:rt.color,'stroke-width':4},pg);
    const t=el('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':13,'font-weight':900,fill:'#222',y:1},pg);t.textContent=i+1;
    if(labels){const tx=el('text',{x:20,y:1,'dominant-baseline':'central','font-size':13,'font-weight':800,fill:'#222',stroke:'#fff','stroke-width':4,'paint-order':'stroke','stroke-linejoin':'round'},pg);tx.textContent=R.pool[st.spots[i]].n}
  });
}
function redrawSelected(){
  const g=svg.querySelector(`.route[data-id="${st.route.id}"]`);if(!g)return;
  g.querySelectorAll('path').forEach(p=>p.setAttribute('d',st.geo.d));
  const lb=g.querySelector('.r-label');lb.dataset.y=st.geo.bbox[1]-6;applyScale();
}
/* side: 'card' (card covers right) or 'drawer' (drawer covers left / bottom on mobile) */
function focusRect(bb,side){
  const pad=Math.max(bb[2],bb[3])*1.05;let x=bb[0]-pad,y=bb[1]-pad*1.1,w=bb[2]+pad*2,h=bb[3]+pad*2.1;
  const r=stage.getBoundingClientRect(),mobile=r.width<=900;
  if(side==='drawer'){
    if(mobile){const nh=h/(1-.58);h=nh}
    else{const f=Math.min(.6,412/r.width),nw=w/(1-f);x-=nw-w;w=nw}
  }else if(side==='card'&&!mobile){const f=Math.min(.6,(380+r.width*.06)/r.width);w=w/(1-f)}
  return fitRect(x,y,w,h);
}
function topbar(html){$('#topbar').innerHTML=html||''}
function openDrawer(){panel.classList.add('open');panel.scrollTop=0}
function closeDrawer(){panel.classList.remove('open')}

/* ============ CARD / DRAWER CONTENT ============ */
function timelineHTML(p,rt){
  const c=rt.color;
  let h=p.items.map((it,i)=>`<div class="tli"><div class="tm">${hm(it.arrive)}</div><div class="nd" style="border-color:${c}">${i+1}</div><div class="bd"><strong>${it.spot.n}</strong><span>${it.spot.t} · ${it.spot.d} · ${it.spot.m}분 머물기</span>${it.leg?`<div><span class="leg ${it.leg.mode}">${it.leg.mode==='bus'?'🚌 버스':'👟 도보'} ${it.leg.min}분 · ${f1(it.leg.km)}km</span></div>`:''}</div></div>`).join('');
  h+=`<div class="tli end"><div class="tm">${hm(p.end)}</div><div class="nd">✓</div><div class="bd"><strong>${p.g.closed?'출발점 복귀, 그림 완성':'마지막 스팟, 그림 완성'}</strong><span>${SHAPES[rt.shape].label} 모양이 지도 위에 완성돼요</span></div></div>`;
  return `<div class="tl">${h}</div>`;
}
function cardHTML(){
  const rt=st.route,R=regionOf(rt),p=plan(rt,st.diff,st.spots,st.start),no=REGIONS.flatMap(r=>r.routes).indexOf(rt)+1;
  return `<div class="card" id="card"><div class="inner">
  <div class="face"><div class="cf-top" style="background:${tint(rt.color)}"><span class="no">No.${String(no).padStart(2,'0')}</span><span class="rg">${R.name}</span>${miniSVG(rt.shape,rt.color,{size:190,pins:p.items.length,sw:.09})}</div>
   <div class="cf-body"><h4>${rt.name}</h4><p>${SHAPES[rt.shape].desc}. ${p.items.slice(0,3).map(i=>i.spot.n).join(', ')} 등을 지나요.</p>
   <div class="cstats"><div><small>거리</small><b>${f1(p.km)}km</b></div><div><small>소요</small><b>${dur(p.total)}</b></div><div><small>스팟</small><b>${p.items.length}곳</b></div></div>
   <button class="btn full" data-act="flip">카드 뒤집어 동선 보기</button></div></div>
  <div class="face back-face"><div class="bk-head"><small>ROUTE DETAIL · ${hm(st.start)} 출발</small><h4>${rt.name}</h4></div>
   <div class="bk-body">${timelineHTML(p,rt)}<div class="bus" style="margin:4px 0 12px 10px"><span>🚌</span><span><b>출발지까지</b><br>${R.bus}</span></div></div>
   <div class="bk-foot"><button class="btn ghost sm" data-act="unflip">앞면</button><button class="btn o sm" data-act="custom">스팟 바꾸기</button></div></div>
  </div></div>`;
}
function pCustom(pop=-1){
  const rt=st.route,p=plan(rt,st.diff,st.spots,st.start);
  const opts=[];for(let m=480;m<=840;m+=30)opts.push(`<option value="${m}" ${m===st.start?'selected':''}>${hm(m)} 출발</option>`);
  panel.innerHTML=`<div>
  <button class="back" data-act="toCard">← 코스 카드로</button>
  <div class="kicker"><span class="dot"></span>그림 모양은 그대로, 장소만 바꿔요</div>
  <h2>${rt.name}</h2>
  <div class="field"><label for="startSel">출발 시각</label><select id="startSel">${opts.join('')}</select></div>
  <div class="field"><label>난이도</label><div class="seg">${Object.keys(DIFF).map(k=>`<button class="${k===st.diff?'on':''}" data-act="diff:${k}">${k}<small>스팟 ${DIFF[k].n}곳</small></button>`).join('')}</div></div>
  <div class="sum"><div><small>거리</small><b>${f1(p.km)}km</b></div><div><small>소요</small><b>${dur(p.total)}</b></div><div><small>종료</small><b>${hm(p.end)}</b></div></div>

  <div style="display:grid;gap:8px">${p.items.map((it,i)=>`<div class="spot ${i===pop?'pop':''}"><div class="nd" style="border-color:${rt.color}">${i+1}</div><div><strong>${it.spot.n}</strong><span>${hm(it.arrive)} 도착 · ${it.spot.t} · ${it.spot.m}분</span></div><button class="swap" data-act="swap:${i}">스팟 교체</button></div>`).join('')}</div>
  <div class="stack"><button class="btn o full" data-act="walk">이 코스로 걷기 시작</button></div>
  </div>`;
  $('#startSel').onchange=e=>{st.start=+e.target.value;pCustom()};
}
function pWalk(){
  const rt=st.route,p=plan(rt,st.diff,st.spots,st.start);

  <div class="kicker"><span class="dot"></span>${rt.name} 그리는 중</div>

  <div class="stack"><button class="btn o full" id="wPlay" data-act="play">일시정지</button><button class="btn full" data-act="next">다음 경유지로 이동</button><button class="btn ghost full" data-act="quit">걷기 그만두기</button></div>
  </div>`;
}

/* ============ FLOW ============ */
async function goIntro(){
  if(st.busy)return;st.busy=true;
  stopWalk();st.region=null;st.route=null;setStep(1);closeOverlay();closeDrawer();topbar('');
  $('#routeLayer').innerHTML='';$('#pinLayer').innerHTML='';$('#walkLayer').innerHTML='';
  hint('지역을 눌러 확대해보세요');
  await zoomTo(fitRect(0,0,W,H),1000);
  drawAreas();st.busy=false;
}
async function goRegion(id){
  if(st.busy)return;st.busy=true;
  stopWalk();closeOverlay();closeDrawer();st.region=id;st.route=null;
  $('#hotLayer').innerHTML='';$('#pinLayer').innerHTML='';$('#walkLayer').innerHTML='';$('#routeLayer').innerHTML='';
  const R=region();setStep(2);hint('');
  topbar(`<button class="tb-back" data-act="intro">← 전체 지도</button><span class="tb-title"><i></i>${R.name}</span>`);
  await zoomTo(regionRect(R),1300);
  drawRoutes(R);
  await sleep(600);setStep(3);hint('원하는 그림 선을 눌러보세요');st.busy=false;
}
function selectRoute(id){
  const rt=routeById(id);if(!rt||st.busy||regionOf(rt).id!==st.region)return;
  st.route=rt;st.diff='보통';st.start=600;st.spots=spotsFor(rt,'보통');st.geo=geom(rt,st.diff);
  svg.querySelectorAll('#routeLayer .route').forEach(g=>{g.classList.toggle('dim',g.dataset.id!==id);g.classList.remove('hl')});
  setStep(4);hint('');drawPins(false);
  topbar(`<button class="tb-back" data-act="backRegion">← 다른 그림 고르기</button>`);

}
function showCard(){overlay.innerHTML=cardHTML();requestAnimationFrame(()=>requestAnimationFrame(()=>{const c=$('#card');c&&c.classList.add('show')}))}
function closeOverlay(){overlay.style.cssText='';const c=overlay.firstElementChild;if(!c)return;c.classList&&c.classList.remove('show');setTimeout(()=>{if(overlay.firstElementChild===c)overlay.innerHTML=''},400)}
function flip(on){const c=$('#card');if(!c)return;c.classList.toggle('flipped',on);setStep(on?5:4);drawPins(on)}
async function goCustom(){
  setStep(6);closeOverlay();topbar('');pCustom();openDrawer();drawPins(true);
  await zoomTo(focusRect(st.geo.bbox,'drawer'),900);
}
function backToCard(){
  closeDrawer();setStep(5);showCard();
  topbar(`<button class="tb-back" data-act="backRegion">← 다른 그림 고르기</button>`);
  setTimeout(()=>flip(true),350);zoomTo(focusRect(st.geo.bbox,'card'),800);
}
function backRegion(){
  closeOverlay();st.route=null;$('#pinLayer').innerHTML='';
  svg.querySelectorAll('#routeLayer .route').forEach(g=>g.classList.remove('dim'));
  const R=region();setStep(3);hint('원하는 그림 선을 눌러보세요');
  topbar(`<button class="tb-back" data-act="intro">← 전체 지도</button><span class="tb-title"><i></i>${R.name}</span>`);
  zoomTo(regionRect(R),900);

function swapSpot(i){
  const R=regionOf(st.route),used=new Set(st.spots);let k=0,cand;
  do{st.swapPtr=(st.swapPtr+1)%R.pool.length;cand=st.swapPtr;k++}while(used.has(cand)&&k<50);
  if(used.has(cand)){toast('바꿀 수 있는 장소가 더 없어요');return}
  const old=R.pool[st.spots[i]].n;st.spots[i]=cand;
  const sc=panel.scrollTop;toast(`${old} → <b>${R.pool[cand].n}</b>`);pCustom(i);panel.scrollTop=sc;drawPins(true);
  const pg=$('#pinLayer').children[i];if(pg){pg.style.opacity=0;setTimeout(()=>pg.style.opacity=1,120)}
}
function setDiff(k){
  st.diff=k;st.spots=spotsFor(st.route,k);st.geo=geom(st.route,k);redrawSelected();drawPins(true);
  const sc=panel.scrollTop;pCustom();panel.scrollTop=sc;
  zoomTo(focusRect(st.geo.bbox,'drawer'),600);
}

/* ---- walk ---- */
function startWalk(){
  setStep(7);const rt=st.route,g=st.geo,L=$('#walkLayer');L.innerHTML='';
  svg.querySelectorAll('#routeLayer .route').forEach(x=>x.classList.add('off'));
  const col=rt.color;
  el('path',{d:g.d,class:'walk-base'},L);
  el('path',{d:g.d,class:'walk-ghost',stroke:col},L);
  const prog=el('path',{d:g.d,class:'walk-prog',stroke:col,'stroke-dasharray':`${g.L} ${g.L}`,'stroke-dashoffset':g.L},L);
  drawPins(true);
  const wk=scaled(L,g.pins[0][0],g.pins[0][1],'walker');
  el('circle',{class:'pulse',r:20,fill:col,opacity:.5},wk);
  el('circle',{r:10,fill:'#222',stroke:'#fff','stroke-width':3.5},wk);
  const p=plan(rt,st.diff,st.spots,st.start);
  st.walk={t:0,playing:true,next:1,last:performance.now(),pause:0,prog,wk,p,raf:0};
  pWalk();openDrawer();arrive(0);hint('');
  zoomTo(focusRect(g.bbox,'drawer'),800);
  st.walk.raf=requestAnimationFrame(tick);
}
function walkTarget(){const w=st.walk,g=st.geo;return w.next<g.fr.length?g.fr[w.next]:1}
function tick(now){
  const w=st.walk;if(!w)return;
  const dt=Math.min(64,now-w.last);w.last=now;
  if(w.playing&&now>w.pause){
    const tgt=walkTarget();w.t=Math.min(tgt,w.t+dt/16000);
    if(w.t>=tgt-1e-6){arrive(w.next);w.next++;w.pause=now+1100;if(w.next>st.geo.fr.length){renderWalk();return finishWalk()}}
  }
  renderWalk();w.raf=requestAnimationFrame(tick);
}
function renderWalk(){
  const w=st.walk,g=st.geo,pt=w.prog.getPointAtLength(w.t*g.L);
  w.wk.dataset.x=pt.x;w.wk.dataset.y=pt.y;w.wk.setAttribute('transform',`translate(${pt.x},${pt.y}) scale(${upp()})`);
  w.prog.setAttribute('stroke-dashoffset',g.L*(1-w.t));
  const pc=Math.round(w.t*100),a=$('#wPct');if(!a)return;
  a.innerHTML=pc+'<small>%</small>';$('#wBar').style.width=pc+'%';
  const it=w.p.items,ni=w.next;
  $('#wNext').textContent=ni<it.length?it[ni].spot.n:(g.closed?'출발점 '+it[0].spot.n:'그림 완성');
  const cur=it[Math.min(ni,it.length)-1];$('#wClock').textContent=cur?`${hm(cur.leave)} 무렵 ${cur.spot.n} 출발`:'';
}
function arrive(i){
  const w=st.walk,n=st.geo.fr.length,isEnd=i>=n;
  const ck=panel.querySelector(`.ck[data-i="${isEnd?'end':i}"]`);ck&&ck.classList.add('on');
  const pg=$('#pinLayer').children[isEnd?0:i];if(pg)pg.querySelector('circle').setAttribute('fill',st.route.color==='#222222'?'#F5A623':st.route.color);
  toast(i===0?`<b>출발!</b> ${w.p.items[0].spot.n}에서 그리기 시작`:isEnd?`<b>${SHAPES[st.route.shape].label}</b> 완성!`:`📍 <b>${w.p.items[i].spot.n}</b> 도착 · ${w.p.items[i].spot.m}분 머물기`);
}
function stopWalk(){if(st.walk){cancelAnimationFrame(st.walk.raf);st.walk=null}}
function togglePlay(){const w=st.walk;if(!w)return;w.playing=!w.playing;$('#wPlay').textContent=w.playing?'일시정지':'이어서 걷기'}
function nextStop(){const w=st.walk;if(!w)return;w.t=walkTarget();w.pause=0}
function quitWalk(){stopWalk();$('#walkLayer').innerHTML='';svg.querySelectorAll('#routeLayer .route').forEach(x=>x.classList.remove('off'));goCustom()}
async function finishWalk(){
  cancelAnimationFrame(st.walk.raf);st.walk=null;
  await sleep(900);setStep(8);closeDrawer();
  await zoomTo(focusRect(st.geo.bbox,'none'),700);
  showDone();
}

/* ---- complete card ---- */
function doneMapSVG(){
  const rt=st.route,g=st.geo,bb=g.bbox,pad=Math.max(bb[2],bb[3])*.32;
  const x=bb[0]-pad,y=bb[1]-pad,w=bb[2]+pad*2,h=bb[3]+pad*2,s=Math.max(w/350,h/250),col=rt.color;
  return `<svg viewBox="${f1(x)} ${f1(y)} ${f1(w)} ${f1(h)}" preserveAspectRatio="xMidYMid slice"><use href="#baseimg"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#F8F7F2" opacity=".25"/>
  <path d="${g.d}" fill="none" stroke="#fff" stroke-width="${12*s}" stroke-linecap="round" stroke-linejoin="round"/><path d="${g.d}" fill="none" stroke="${col}" stroke-width="${6*s}" stroke-linecap="round" stroke-linejoin="round"/>
  ${g.pins.map((p,i)=>`<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${9*s}" fill="${col==='#222222'?'#F5A623':col}" stroke="#222" stroke-width="${2.5*s}"/><text x="${f1(p[0])}" y="${f1(p[1]+s)}" text-anchor="middle" dominant-baseline="central" font-size="${10*s}" font-weight="900" fill="#fff">${i+1}</text>`).join('')}</svg>`;
}
function showDone(){
  const rt=st.route,R=regionOf(rt),p=plan(rt,st.diff,st.spots,st.start);
  const d=new Date(),ds=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  overlay.style.cssText='justify-content:center;flex-direction:column;background:rgba(248,247,242,.62)';
  overlay.innerHTML=`<div class="done" id="done"><div class="done-top"><span>JEJU<i>:</i>RO 완주 카드</span><span>${ds}</span></div>
  <div class="done-map">${doneMapSVG()}<div class="stamp"><div><b>${SHAPES[rt.shape].label}</b>완성</div></div></div>
  <div class="done-body"><h4>${rt.name}</h4><p>${p.items.map(i=>i.spot.n).join(' → ')}</p>
  <div class="cstats"><div><small>거리</small><b>${f1(p.km)}km</b></div><div><small>시간</small><b>${dur(p.total)}</b></div><div><small>지역</small><b>${R.name.split('·')[0]}</b></div></div></div></div>
  <div class="done-actions"><button class="btn o sm" data-act="save">이미지 저장</button><button class="btn sm" data-act="share">공유하기</button><button class="btn ghost sm" data-act="intro" style="background:#fff">처음으로</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('#done').classList.add('show')));
}
async function saveCard(){
  const rt=st.route,R=regionOf(rt),p=plan(rt,st.diff,st.spots,st.start),g=st.geo;
  const cw=1080,ch=1350,c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
  const F="'Wanted Sans Variable','Wanted Sans',sans-serif";
  x.fillStyle='#F8F7F2';x.fillRect(0,0,cw,ch);
  x.fillStyle='#222';x.fillRect(0,0,cw,110);
  x.font=`900 46px ${F}`;x.fillStyle='#fff';x.fillText('JEJU',60,72);const jw=x.measureText('JEJU').width;x.fillStyle='#F5A623';x.fillText(':',60+jw,72);x.fillStyle='#fff';x.fillText('RO',60+jw+x.measureText(':').width,72);
  x.font=`700 30px ${F}`;x.textAlign='right';const d=new Date();x.fillText(`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`,cw-60,70);x.textAlign='left';
  const img=new Image();img.src=$('#baseimg').getAttribute('href');await img.decode().catch(()=>{});
  const mh=720,mt=110,bb=g.bbox,pad=Math.max(bb[2],bb[3])*.32;let vw=bb[2]+pad*2,vh=bb[3]+pad*2;const ar=cw/mh;if(vw/vh<ar)vw=vh*ar;else vh=vw/ar;
  const vx=bb[0]+bb[2]/2-vw/2,vy=bb[1]+bb[3]/2-vh/2,k=img.naturalWidth/W;
  x.save();x.beginPath();x.rect(0,mt,cw,mh);x.clip();x.fillStyle='#BFE2E4';x.fillRect(0,mt,cw,mh);
  try{x.drawImage(img,vx*k,vy*k,vw*k,vh*k,0,mt,cw,mh)}catch(e){}
  const sc=cw/vw;x.translate(-vx*sc,mt-vy*sc);x.scale(sc,sc);const P=new Path2D(g.d);x.lineCap='round';x.lineJoin='round';
  x.strokeStyle='#fff';x.lineWidth=26/sc;x.stroke(P);x.strokeStyle=rt.color;x.lineWidth=13/sc;x.stroke(P);
  g.pins.forEach((pt,i)=>{x.beginPath();x.arc(pt[0],pt[1],20/sc,0,7);x.fillStyle=rt.color==='#222222'?'#F5A623':rt.color;x.fill();x.lineWidth=5/sc;x.strokeStyle='#222';x.stroke();x.fillStyle='#fff';x.font=`900 ${22/sc}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.fillText(i+1,pt[0],pt[1]+1/sc)});
  x.restore();x.textAlign='left';x.textBaseline='alphabetic';
  x.fillStyle='#222';x.fillRect(0,mt+mh,cw,5);
  x.save();x.translate(cw-150,mt+mh-10);x.rotate(.2);x.beginPath();x.arc(0,0,92,0,7);x.fillStyle='#F5A623';x.fill();x.lineWidth=5;x.strokeStyle='#222';x.stroke();x.fillStyle='#222';x.textAlign='center';x.font=`900 40px ${F}`;x.fillText(SHAPES[rt.shape].label,0,0);x.font=`800 26px ${F}`;x.fillText('완성',0,36);x.restore();
  x.fillStyle='#222';x.font=`900 72px ${F}`;x.fillText(rt.name,60,mt+mh+120);
  x.font=`600 28px ${F}`;x.fillStyle='#7A766C';const route=p.items.map(i=>i.spot.n).join(' → ');x.fillText(route.length>34?route.slice(0,34)+'…':route,60,mt+mh+172);
  [['거리',f1(p.km)+'km'],['시간',dur(p.total)],['지역',R.name]].forEach((s,i)=>{const bx=60+i*330;x.fillStyle='#EDEAE0';x.beginPath();x.roundRect?x.roundRect(bx,mt+mh+215,310,130,24):x.rect(bx,mt+mh+215,310,130);x.fill();x.fillStyle='#7A766C';x.font=`700 26px ${F}`;x.fillText(s[0],bx+28,mt+mh+262);x.fillStyle='#222';x.font=`900 42px ${F}`;x.fillText(s[1],bx+28,mt+mh+318)});
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`JEJURO_${rt.name.replace(/\s/g,'_')}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('<b>완주 카드</b>를 저장했어요')},'image/png');
}
async function share(){
  const rt=st.route,p=plan(rt,st.diff,st.spots,st.start);
  const text=`JEJU:RO에서 '${rt.name}' ${SHAPES[rt.shape].label} 그림 완주! ${f1(p.km)}km · ${p.items.map(i=>i.spot.n).join(' → ')} #제주로 #제주뚜벅이`;
  try{if(navigator.share){await navigator.share({title:'JEJU:RO 완주',text});return}await navigator.clipboard.writeText(text);toast('공유 문구를 <b>복사</b>했어요')}catch(e){toast('공유를 취소했어요')}
}

/* ============ EVENTS ============ */
function act(a){
  const [k,v]=a.split(':');
  if(k==='intro')goIntro();
  else if(k==='region'){if(st.step===1)goRegion(v)}
  else if(k==='route'){if(st.step===3||st.step===4)selectRoute(v)}
  else if(k==='backRegion')backRegion();
  else if(k==='flip')flip(true);
  else if(k==='unflip')flip(false);
  else if(k==='toCard')backToCard();
  else if(k==='custom')goCustom();
  else if(k==='swap')swapSpot(+v);
  else if(k==='diff')setDiff(v);
  else if(k==='walk')startWalk();
  else if(k==='play')togglePlay();
  else if(k==='next')nextStop();
  else if(k==='quit')quitWalk();
  else if(k==='save')saveCard();
  else if(k==='share')share();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)act(t.dataset.act)});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('svg [data-act]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act(t.dataset.act)}});
/* 휠/핀치로도 확대·축소 */
svg.addEventListener('wheel',e=>{
  if(st.busy)return;
  if(st.step===1&&e.deltaY<0){e.preventDefault();const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
    let best,bd=1e18;REGIONS.forEach(r=>{const a=AREAS[r.id],dd=((q.x-a[0])/a[2])**2+((q.y-a[1])/a[3])**2;if(dd<bd){bd=dd;best=r}});goRegion(best.id)}
  else if(st.step===3&&e.deltaY>0){e.preventDefault();goIntro()}
},{passive:false});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(applyScale,80)});

/* init */
setStep(1);setVB(fitRect(0,0,W,H));drawAreas();
</script>
